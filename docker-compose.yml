# Conduit on-premises stack.
#
# Appwrite runs separately (remote/self-hosted); point .env at it. Everything
# else (apps, bridge, broker, video, proxy) runs here. From the repo root:
#
#   cp .env.example .env   # fill in the handful of values
#   docker compose up -d --build
#
# The root .env is auto-discovered — no --env-file flag needed. Stable internal
# URLs default in this file; .env only carries what changes per deployment.
#
# mDNS (conduit.local + player./mqtt. aliases) is still the host avahi setup —
# see infra/conduit-mdns.service. Grab the Caddy CA for devices with `make ca`.

name: conduit

networks:
  conduit:
    driver: bridge

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT (TCP) — server/bridge
      - "9001:9001" # MQTT over WebSocket — player browser
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    networks: [conduit]

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "1984:1984" # API / HLS
    volumes:
      - ./infra/go2rtc.yml:/config/go2rtc.yaml
    networks: [conduit]

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        # Appwrite is the same remote URL for browser and server.
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
        NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID}
        # Stable conduit.local public URLs — same on every network.
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://conduit.local}
        NEXT_PUBLIC_GO2RTC_URL: ${NEXT_PUBLIC_GO2RTC_URL:-https://conduit.local/go2rtc}
        NEXT_PUBLIC_NOVNC_URL_TEMPLATE: ${NEXT_PUBLIC_NOVNC_URL_TEMPLATE:-http://{host}:6080/vnc.html?autoconnect=1&resize=scale}
    restart: unless-stopped
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
      GO2RTC_API_URL: ${GO2RTC_API_URL:-http://go2rtc:1984}
    expose:
      - "3000"
    networks: [conduit]

  player:
    build:
      context: .
      dockerfile: apps/player/Dockerfile
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
        NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID}
        NEXT_PUBLIC_MQTT_WS_URL: ${NEXT_PUBLIC_MQTT_WS_URL:-wss://mqtt.conduit.local}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://conduit.local}
        NEXT_PUBLIC_PLAYER_VERSION: ${NEXT_PUBLIC_PLAYER_VERSION:-0.0.0}
        NEXT_PUBLIC_OPENWEATHER_API_KEY: ${NEXT_PUBLIC_OPENWEATHER_API_KEY:-}
    restart: unless-stopped
    expose:
      - "3001"
    networks: [conduit]

  bridge:
    build:
      context: .
      dockerfile: services/bridge/Dockerfile
    restart: unless-stopped
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
    depends_on: [mosquitto]
    networks: [conduit]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [cms, player]
    networks: [conduit]

  # mDNS for conduit.local + player./mqtt.conduit.local stays a host-level avahi
  # setup (infra/conduit-mdns.service); see infra/mdns-aliases.sh.

volumes:
  mosquitto-data:
  caddy-data:
  caddy-config:
