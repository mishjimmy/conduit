# go2rtc stream definitions.
# The CMS rewrites this file when layouts using camera-grid / pip layers are saved
# (M7). Single cameras are HLS passthrough; multi-camera views are composited by
# FFmpeg (xstack) and exposed here as a single HLS stream.

api:
  listen: ":1984"

# Example camera (uncomment and set a real RTSP URL):
# streams:
#   lobby_cam_1: rtsp://user:pass@192.168.1.50:554/stream1
#   lobby_grid:
#     - "ffmpeg:lobby_cam_1#video=h264"
