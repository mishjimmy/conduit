# Conduit on-premises stack.
#
# Appwrite runs from its own official compose; point the env at it. Everything
# else (apps, bridge, broker, video, proxy) runs here. Build + run from the repo
# root env file:
#
#   docker compose -f infra/docker-compose.yml --env-file ../.env up -d --build
#
# (run from the infra/ directory, or adjust the --env-file path accordingly)

name: conduit

networks:
  conduit:
    driver: bridge

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT (TCP) — server/bridge
      - "9001:9001" # MQTT over WebSocket — player browser
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    networks: [conduit]

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "1984:1984" # API / HLS
    volumes:
      - ./go2rtc.yml:/config/go2rtc.yaml
    networks: [conduit]

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
        NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${NEXT_PUBLIC_APPWRITE_DATABASE_ID}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_GO2RTC_URL: ${NEXT_PUBLIC_GO2RTC_URL}
        NEXT_PUBLIC_NOVNC_URL_TEMPLATE: ${NEXT_PUBLIC_NOVNC_URL_TEMPLATE}
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "3000"
    networks: [conduit]

  player:
    build:
      context: ..
      dockerfile: apps/player/Dockerfile
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
        NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${NEXT_PUBLIC_APPWRITE_DATABASE_ID}
        NEXT_PUBLIC_MQTT_WS_URL: ${NEXT_PUBLIC_MQTT_WS_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_PLAYER_VERSION: ${NEXT_PUBLIC_PLAYER_VERSION}
        NEXT_PUBLIC_OPENWEATHER_API_KEY: ${NEXT_PUBLIC_OPENWEATHER_API_KEY:-}
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "3001"
    networks: [conduit]

  bridge:
    build:
      context: ..
      dockerfile: services/bridge/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on: [mosquitto]
    networks: [conduit]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [cms, player]
    networks: [conduit]

  # mDNS for conduit.local + player.conduit.local. Easiest on the host network;
  # on Linux: `apt install avahi-daemon`, set hostname to `conduit`, and run
  # infra/mdns-aliases.sh to publish player.conduit.local. To containerize:
  # avahi:
  #   image: flungo/avahi
  #   network_mode: host
  #   restart: unless-stopped

volumes:
  mosquitto-data:
  caddy-data:
  caddy-config:
